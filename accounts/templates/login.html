{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#0A0713] font-['Space_Grotesk'] relative overflow-hidden">

    <!-- luces de fondo -->
    <div class="pointer-events-none absolute -top-40 -left-32 w-[32rem] h-[32rem] bg-purple-600/40 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none absolute top-1/3 -right-40 w-[28rem] h-[28rem] bg-fuchsia-500/30 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none absolute bottom-0 left-1/4 w-[26rem] h-[26rem] bg-violet-700/40 rounded-full blur-[130px]"></div>

    <!-- textura sutil de grano -->
    <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.05)_1px,transparent_0)] bg-[size:24px_24px]"></div>

    <div class="relative min-h-screen flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md">

            <!-- marca -->
            <div class="flex justify-center mb-8">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-400 to-fuchsia-600 shadow-[0_0_35px_-5px_rgba(192,132,252,0.8)] flex items-center justify-center">
                    <span class="text-white text-xl font-semibold">
                        <img src="{% static 'img/logo.png' %}" alt="">
                    </span>
                </div>
            </div>

            <!-- tarjeta de cristal -->
            <div class="rounded-3xl bg-white/[0.04] backdrop-blur-2xl border border-white/10 shadow-[0_0_60px_-15px_rgba(168,85,247,0.35)] px-8 py-10 sm:px-10">

                <h1 class="text-2xl text-white font-medium text-center">
                    Bienvenido de vuelta
                </h1>
                <p class="mt-2 text-sm text-white/40 text-center">
                    Ingresa tus credenciales para continuar
                </p>

                {% if form.errors %}
                <div class="mt-6 rounded-xl border border-fuchsia-400/30 bg-fuchsia-500/10 text-fuchsia-200 text-sm px-4 py-3 text-center">
                    Usuario o contraseña incorrectos
                </div>
                {% endif %}

                <form action="{% url 'login' %}" method="post" class="mt-8 space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="username" class="block text-xs text-white/50 mb-2 ml-1">
                            Usuario
                        </label>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            placeholder="Nombre de usuario"
                            required
                            autofocus
                            value="{{ form.username.value|default:'' }}"
                            class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder:text-white/25 outline-none focus:bg-white/[0.07] focus:border-purple-400/60 focus:ring-4 focus:ring-purple-500/20 transition-all"
                        >
                    </div>

                    <div>
                        <label for="password" class="block text-xs text-white/50 mb-2 ml-1">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="••••••••"
                            required
                            class="w-full rounded-xl bg-white/5 border border-white/10 px-4 py-3 text-white placeholder:text-white/25 outline-none focus:bg-white/[0.07] focus:border-purple-400/60 focus:ring-4 focus:ring-purple-500/20 transition-all"
                        >
                    </div>

                    <div class="flex items-center justify-between text-xs pt-1">
                        <a href="{% url 'registro' %}" class="text-white/40 hover:text-purple-300 transition-colors">
                            Registrarse
                        </a>
                        <a href="#" class="text-white/40 hover:text-purple-300 transition-colors">
                            ¿Olvidaste tu contraseña?
                        </a>
                    </div>

                    <button
                        type="submit"
                        class="w-full rounded-xl bg-gradient-to-r from-purple-500 to-fuchsia-600 text-white py-3 text-sm font-medium shadow-[0_0_30px_-8px_rgba(192,132,252,0.7)] hover:shadow-[0_0_40px_-6px_rgba(192,132,252,0.9)] hover:from-purple-400 hover:to-fuchsia-500 focus:outline-none focus:ring-4 focus:ring-purple-500/30 transition-all"
                    >
                        Iniciar sesión
                    </button>
                </form>
            </div>

            <p class="mt-8 text-center text-xs text-white/25">
                © 2026 — Panel interno de gestión
            </p>
        </div>
    </div>

</body>
</html>
