<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear Nuevo Proyecto</title>


    <script src="https://cdn.tailwindcss.com"></script>


    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        sakura: {
                            950: '#4a202a',
                            900: '#632936',
                            800: '#823b4b',
                            700: '#a94d61',
                            600: '#c96176',
                            500: '#e57d90',
                            400: '#f1889b',
                            300: '#f99aaa',
                            200: '#fdb4bf',
                            100: '#ffccd4',
                            50: '#fff1f4',
                        },

                    },

                    fontFamily: {

                        'jp-serif': ['Noto Serif JP', 'serif'],

                        'sans-refined': ['Plus Jakarta Sans', 'sans-serif'],

                    },

                    keyframes: {

                        sparkle: {

                            '0%, 100%': {
                                opacity: '.2',
                                transform: 'translateY(0) scale(.8)'
                            },

                            '50%': {
                                opacity: '1',
                                transform: 'translateY(-9px) scale(1.15)'
                            },

                        },

                        floatSakura: {

                            '0%, 100%': {
                                transform: 'rotate(-2deg) translateY(0)'
                            },

                            '50%': {
                                transform: 'rotate(2deg) translateY(-5px)'
                            },

                        },

                    },

                    animation: {

                        sparkle: 'sparkle 3s ease-in-out infinite',

                        'float-sakura': 'floatSakura 6s ease-in-out infinite',

                    },

                }

            }

        }

    </script>


    <style>

        .sakura-sparkle {
            position: absolute;
            pointer-events: none;
            color: white;
            text-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 14px rgba(229,125,144,.8);
        }

        .sakura-branch {
            position: absolute;
            pointer-events: none;
            opacity: .5;
            filter: drop-shadow(0 5px 10px rgba(166,72,95,.12));
        }

        .branch-line {
            position: absolute;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(
                90deg,
                transparent,
                #9e5968,
                #c47a89
            );
            transform-origin: left center;
        }

        .sakura-flower {
            position: absolute;
            font-size: 20px;
        }

    </style>


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

</head>


<body class="min-h-screen flex items-center justify-center p-4 md:p-8 bg-sakura-50 text-sakura-950 antialiased relative overflow-hidden font-['Plus_Jakarta_Sans']">


    <!-- ================================================= -->
    <!-- FONDO -->
    <!-- ================================================= -->

    <div class="pointer-events-none absolute inset-0 overflow-hidden">


        <div class="absolute -top-40 -left-40 w-[32rem] h-[32rem] bg-sakura-200/50 rounded-full blur-[120px]">
        </div>


        <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-sakura-300/35 rounded-full blur-[120px]">
        </div>


        <div class="absolute bottom-0 left-1/4 w-[28rem] h-[28rem] bg-sakura-100/70 rounded-full blur-[120px]">
        </div>


        <div class="absolute inset-0 opacity-30 bg-[radial-gradient(circle_at_1px_1px,rgba(229,125,144,0.13)_1px,transparent_0)] bg-[size:26px_26px]">
        </div>


        <!-- DESTELLOS -->

        <span class="sakura-sparkle animate-sparkle text-lg"
              style="top:10%;left:12%;">
            ✦
        </span>

        <span class="sakura-sparkle animate-sparkle text-sm"
              style="top:30%;left:23%;">
            ✧
        </span>

        <span class="sakura-sparkle animate-sparkle text-xs"
              style="top:70%;left:10%;">
            ✦
        </span>

        <span class="sakura-sparkle animate-sparkle text-lg"
              style="top:18%;right:13%;">
            ✧
        </span>

        <span class="sakura-sparkle animate-sparkle text-sm"
              style="top:55%;right:10%;">
            ✦
        </span>

        <span class="sakura-sparkle animate-sparkle text-xs"
              style="top:83%;right:25%;">
            ✧
        </span>

    </div>



    <!-- ================================================= -->
    <!-- RAMA IZQUIERDA -->
    <!-- ================================================= -->

    <div class="sakura-branch hidden lg:block left-[-90px] top-[30px] w-[260px] h-[430px] animate-float-sakura">

        <div class="branch-line w-[280px] top-[80px] left-0 rotate-[35deg]"></div>

        <div class="branch-line w-[160px] top-[155px] left-[50px] rotate-[65deg]"></div>

        <div class="branch-line w-[135px] top-[220px] left-[100px] rotate-[25deg]"></div>

        <div class="branch-line w-[120px] top-[285px] left-[65px] rotate-[75deg]"></div>


        <span class="sakura-flower top-[60px] left-[120px]">🌸</span>

        <span class="sakura-flower top-[120px] left-[180px]">🌸</span>

        <span class="sakura-flower top-[175px] left-[110px]">🌸</span>

        <span class="sakura-flower top-[225px] left-[190px]">🌸</span>

        <span class="sakura-flower top-[290px] left-[120px]">🌸</span>

    </div>



    <!-- ================================================= -->
    <!-- RAMA DERECHA -->
    <!-- ================================================= -->

    <div class="sakura-branch hidden lg:block right-[-90px] bottom-[-40px] w-[260px] h-[430px] scale-x-[-1] animate-float-sakura">

        <div class="branch-line w-[280px] top-[80px] left-0 rotate-[35deg]"></div>

        <div class="branch-line w-[160px] top-[155px] left-[50px] rotate-[65deg]"></div>

        <div class="branch-line w-[135px] top-[220px] left-[100px] rotate-[25deg]"></div>

        <div class="branch-line w-[120px] top-[285px] left-[65px] rotate-[75deg]"></div>


        <span class="sakura-flower top-[60px] left-[120px]">🌸</span>

        <span class="sakura-flower top-[120px] left-[180px]">🌸</span>

        <span class="sakura-flower top-[175px] left-[110px]">🌸</span>

        <span class="sakura-flower top-[225px] left-[190px]">🌸</span>

        <span class="sakura-flower top-[290px] left-[120px]">🌸</span>

    </div>



    <!-- ================================================= -->
    <!-- TARJETA -->
    <!-- ================================================= -->

    <div class="relative z-10 w-full max-w-2xl bg-white/80 backdrop-blur-2xl rounded-[2rem] shadow-[0_20px_70px_rgba(166,72,95,.15)] p-6 md:p-10 border border-white">


        <!-- ENCABEZADO -->

        <div class="flex items-center gap-3 mb-8 border-b border-sakura-200 pb-5">


            <div class="bg-sakura-100/80 p-3 rounded-xl text-sakura-500 border border-sakura-200 shadow-sm">

                <i class="fa-regular fa-plus-circle text-2xl"></i>

            </div>


            <div class="flex-1">

                <span class="text-xs tracking-widest uppercase text-sakura-600 block mb-1">

                    プロジェクト — Project Management

                </span>


                <h1 class="text-2xl md:text-3xl font-jp-serif font-light text-sakura-950 tracking-wide">

                    Nuevo Proyecto

                </h1>


                <p class="text-sm text-sakura-700/70 font-light">

                    Completa los campos para crear un nuevo proyecto

                </p>

            </div>


            <a href="{% url 'proyectos' %}"

               class="inline-flex items-center gap-1.5 px-4 py-2 bg-sakura-50 text-sakura-700 text-sm font-medium rounded-xl border border-sakura-200 hover:bg-sakura-100 hover:text-sakura-950 hover:-translate-y-0.5 transition-all">

                <i class="fa-regular fa-arrow-left"></i>

                <span class="hidden sm:inline">
                    Volver
                </span>

            </a>

        </div>



        <!-- FORMULARIO -->

        <div class="bg-sakura-50/60 rounded-2xl p-6 md:p-8 border border-sakura-200 shadow-sm">


            <form method="post" enctype="multipart/form-data" class="space-y-6">

                # lo que agregamos para enviar archivos

                {% csrf_token %}


                <!-- NOMBRE -->

                <div class="space-y-1.5">

                    <label for="id_nombre"
                           class="flex items-center gap-2 text-sm font-semibold text-sakura-700">

                        <i class="fa-regular fa-tag text-sakura-500 text-xs"></i>

                        Nombre del proyecto

                    </label>


                    <input type="text"
                           name="nombre"
                           id="id_nombre"
                           required
                           placeholder="Ej: Desarrollo E-commerce"

                           class="w-full px-4 py-3 bg-white/80 border border-sakura-200 rounded-xl text-sakura-950 placeholder:text-sakura-300 text-sm focus:border-sakura-400 focus:ring-2 focus:ring-sakura-400/20 focus:outline-none transition-all shadow-sm" />

                </div>



                <!-- DESCRIPCIÓN -->

                <div class="space-y-1.5">

                    <label for="id_descripcion"
                           class="flex items-center gap-2 text-sm font-semibold text-sakura-700">

                        <i class="fa-regular fa-align-left text-sakura-500 text-xs"></i>

                        Descripción

                    </label>


                    <textarea name="descripcion"
                              id="id_descripcion"
                              rows="4"
                              required
                              placeholder="Describe el objetivo y alcance del proyecto..."

                              class="w-full px-4 py-3 bg-white/80 border border-sakura-200 rounded-xl text-sakura-950 placeholder:text-sakura-300 text-sm focus:border-sakura-400 focus:ring-2 focus:ring-sakura-400/20 focus:outline-none transition-all resize-y shadow-sm"></textarea>


                    <p class="text-xs text-sakura-500/70 mt-1">

                        Máximo 500 caracteres

                    </p>

                </div>



                <!-- DURACIÓN -->

                <div class="space-y-1.5">

                    <label for="id_duracion"
                           class="flex items-center gap-2 text-sm font-semibold text-sakura-700">

                        <i class="fa-regular fa-clock text-sakura-500 text-xs"></i>

                        Duración estimada

                    </label>


                    <input type="number"
                           name="duracion"
                           id="id_duracion"
                           required
                           placeholder="Ej: 3 meses, 12 semanas, 45 días"

                           class="w-full px-4 py-3 bg-white/80 border border-sakura-200 rounded-xl text-sakura-950 placeholder:text-sakura-300 text-sm focus:border-sakura-400 focus:ring-2 focus:ring-sakura-400/20 focus:outline-none transition-all shadow-sm" />


                    <p class="text-xs text-sakura-500/70 mt-1">

                        Indica el tiempo estimado (ej: 2 semanas, 1 mes)

                    </p>

                </div>



                <!-- IMAGEN -->

                <div>

                    <label for="id_duracion"
                           class="flex items-center gap-2 text-sm font-semibold text-sakura-700">

                        <i class="fa-regular fa-clock text-sakura-500 text-xs"></i>

                        Imagen

                    </label>


                    <input type="file"
                           name="imagen"
                           id="id_imagen"
                           required

                           class="w-full px-4 py-3 bg-white/80 border border-sakura-200 rounded-xl text-sakura-950 placeholder:text-sakura-300 text-sm focus:border-sakura-400 focus:ring-2 focus:ring-sakura-400/20 focus:outline-none transition-all shadow-sm" />

                </div>



                <!-- BOTONES -->

                <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 border-t border-sakura-200">


                    <button type="submit"

                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-gradient-to-r from-sakura-500 to-sakura-400 text-white text-sm font-medium rounded-xl hover:from-sakura-600 hover:to-sakura-500 transition-all duration-200 shadow-lg shadow-sakura-500/20 hover:-translate-y-0.5">

                        <i class="fa-regular fa-check-circle"></i>

                        Guardar Proyecto

                    </button>


                    <a href="{% url 'proyectos' %}"

                       class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-white/80 text-sakura-700 text-sm font-medium rounded-xl hover:bg-sakura-100 transition-all border border-sakura-200">

                        <i class="fa-regular fa-xmark-circle"></i>

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
