<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear Nuevo Proyecto</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-purple': {
                            950: '#0b0614',
                            900: '#140c24',
                            800: '#23153c',
                            700: '#3a2063',
                            500: '#8b5cf6',
                            300: '#c4b5fd',
                            100: '#ede9fe',
                        },
                    },
                    fontFamily: {
                        'jp-serif': ['Noto Serif JP', 'serif'],
                        'sans-refined': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 bg-dark-purple-950 text-dark-purple-100 antialiased">
    <div class="w-full max-w-2xl bg-dark-purple-900 rounded-2xl shadow-2xl shadow-black/40 p-6 md:p-10 border border-dark-purple-800">
        <div class="flex items-center gap-3 mb-8 border-b border-dark-purple-800 pb-5">
            <div class="bg-dark-purple-800/60 p-3 rounded-xl text-dark-purple-500 border border-dark-purple-700">
                <i class="fa-regular fa-plus-circle text-2xl"></i>
            </div>
            <div class="flex-1">
                <span class="text-xs tracking-widest uppercase text-dark-purple-300 block mb-1">
                    プロジェクト — Project Management
                </span>
                <h1 class="text-2xl md:text-3xl font-jp-serif font-light text-white tracking-wide">
                    Nuevo Proyecto
                </h1>
                <p class="text-sm text-dark-purple-300 font-light">
                    Completa los campos para crear un nuevo proyecto
                </p>
            </div>
            <a href="{% url 'proyectos' %}"
               class="inline-flex items-center gap-1.5 px-4 py-2 bg-dark-purple-950 text-dark-purple-300 text-sm font-medium rounded-xl border border-dark-purple-800 hover:bg-dark-purple-800 hover:text-white transition-all">
                <i class="fa-regular fa-arrow-left"></i>
                <span class="hidden sm:inline">
                    Volver
                </span>
            </a>
        </div>
        <div class="bg-dark-purple-950/60 rounded-2xl p-6 md:p-8 border border-dark-purple-800 shadow-sm">
            <form method="post" enctype="multipart/form-data" class="space-y-6"> # lo que agregamos para enviar archivos 
                {% csrf_token %}
                <div class="space-y-1.5">
                    <label for="id_nombre"
                           class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-regular fa-tag text-dark-purple-500 text-xs"></i>
                        Nombre del proyecto
                    </label>
                    <input type="text"
                           name="nombre"
                           id="id_nombre"
                           required
                           placeholder="Ej: Desarrollo E-commerce"
                           class="w-full px-4 py-3 bg-dark-purple-900 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all" />
                </div>
                <div class="space-y-1.5">
                    <label for="id_descripcion"
                           class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-regular fa-align-left text-dark-purple-500 text-xs"></i>
                        Descripción
                    </label>
                    <textarea name="descripcion"
                              id="id_descripcion"
                              rows="4"
                              required
                              placeholder="Describe el objetivo y alcance del proyecto..."
                              class="w-full px-4 py-3 bg-dark-purple-900 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all resize-y"></textarea>
                    <p class="text-xs text-dark-purple-300/60 mt-1">
                        Máximo 500 caracteres
                    </p>
                </div>
                <div class="space-y-1.5">
                    <label for="id_duracion"
                           class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-regular fa-clock text-dark-purple-500 text-xs"></i>
                        Duración estimada
                    </label>
                    <input type="number"
                           name="duracion"
                           id="id_duracion"
                           required
                           placeholder="Ej: 3 meses, 12 semanas, 45 días"
                           class="w-full px-4 py-3 bg-dark-purple-900 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all" />
                    <p class="text-xs text-dark-purple-300/60 mt-1">
                        Indica el tiempo estimado (ej: 2 semanas, 1 mes)
                    </p>
                </div>
                    <label for="id_duracion"
                           class="flex items-center gap-2 text-sm font-semibold text-dark-purple-300">
                        <i class="fa-regular fa-clock text-dark-purple-500 text-xs"></i>
                        Imagen
                    </label>
                    <input type="file"
                           name="imagen"
                           id="id_imagen"
                           required
                           class="w-full px-4 py-3 bg-dark-purple-900 border border-dark-purple-800 rounded-xl text-dark-purple-100 placeholder:text-dark-purple-700 text-sm focus:border-dark-purple-500 focus:ring-2 focus:ring-dark-purple-500/20 focus:outline-none transition-all" />
                </div>
                <div class="pt-4 flex flex-col sm:flex-row items-center gap-3 border-t border-dark-purple-800">
                    <button type="submit"
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-dark-purple-500 text-white text-sm font-medium rounded-xl hover:bg-purple-500 transition-all duration-200 shadow-lg shadow-purple-950/30">
                        <i class="fa-regular fa-check-circle"></i>
                        Guardar Proyecto
                    </button>
                    <a href="{% url 'proyectos' %}"
                       class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 bg-dark-purple-900 text-dark-purple-300 text-sm font-medium rounded-xl hover:bg-dark-purple-800 transition-all border border-dark-purple-800">
                        <i class="fa-regular fa-xmark-circle"></i>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
