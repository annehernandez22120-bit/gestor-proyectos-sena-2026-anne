{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Proyectos · Bienvenida</title>
  <!-- Tailwind CSS v3 (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome, sin clases personalizadas -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#0A0713] font-['Space_Grotesk'] relative overflow-hidden flex items-center justify-center p-4">

  <!-- luces de fondo -->
  <div class="pointer-events-none absolute -top-40 -left-32 w-[32rem] h-[32rem] bg-purple-600/40 rounded-full blur-[120px]"></div>
  <div class="pointer-events-none absolute top-1/3 -right-40 w-[28rem] h-[28rem] bg-fuchsia-500/30 rounded-full blur-[120px]"></div>
  <div class="pointer-events-none absolute bottom-0 left-1/4 w-[26rem] h-[26rem] bg-violet-700/40 rounded-full blur-[130px]"></div>

  <!-- textura sutil de grano -->
  <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_1px_1px,rgba(255,255,255,0.05)_1px,transparent_0)] bg-[size:24px_24px]"></div>

  <!-- Tarjeta principal de cristal -->
  <div class="relative max-w-2xl w-full rounded-3xl bg-white/[0.04] backdrop-blur-2xl border border-white/10 shadow-[0_0_60px_-15px_rgba(168,85,247,0.35)] p-8 md:p-12 text-center transition-all hover:shadow-[0_0_80px_-10px_rgba(192,132,252,0.5)] duration-300">

    <!-- Icono / logo con glow -->
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-purple-400 to-fuchsia-600 shadow-[0_0_35px_-5px_rgba(192,132,252,0.8)] flex items-center justify-center p-[3px]">
        <img src="{% static 'img/logo.png' %}" alt="logo" class="w-full h-full rounded-full object-cover bg-[#0A0713]">
      </div>
    </div>

    <!-- Título principal -->
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-fuchsia-500 tracking-tight">
      Gestor de Proyectos
    </h1>

    <!-- Línea divisoria sutil -->
    <div class="w-24 h-1 bg-gradient-to-r from-purple-400 to-fuchsia-500 mx-auto my-5 rounded-full shadow-[0_0_12px_0_rgba(192,132,252,0.7)]"></div>

    <!-- Mensaje de bienvenida -->
    <p class="text-lg md:text-xl text-white/70 font-light leading-relaxed">
      <span class="font-medium text-purple-300">Bienvenido</span> a tu espacio central para organizar, seguir y <br class="hidden sm:block" />
      hacer crecer tus proyectos con claridad y enfoque.
    </p>

    <!-- Badge / CTA -->
    <a href="{% url 'proyectos' %}">
      <div class="mt-8 inline-flex items-center gap-2 rounded-full bg-white/5 border border-white/10 px-5 py-2 text-sm text-white/80 font-medium shadow-[0_0_20px_-6px_rgba(192,132,252,0.5)] hover:bg-white/[0.08] hover:border-purple-400/40 hover:shadow-[0_0_28px_-4px_rgba(192,132,252,0.7)] transition-all">
        <i class="fa-regular fa-compass text-purple-300"></i>
        <span>Empieza ahora</span>
        <i class="fa-regular fa-arrow-right text-purple-300 text-xs"></i>
      </div>
    </a>

    <!-- Nota final -->
    <div class="mt-6 text-xs text-white/25 font-mono tracking-wider uppercase">
      · gestión ágil · visión clara ·
    </div>
  </div>

</body>
</html>
