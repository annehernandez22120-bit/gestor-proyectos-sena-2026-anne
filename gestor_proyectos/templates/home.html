{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gestor de Proyectos · Bienvenida</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


  <script>

    tailwind.config = {
      theme: {
        extend: {

          colors: {

            sakura: {
              950: '#4a202a',
              900: '#632936',
              800: '#823b4b',
              700: '#a94d61',
              600: '#c96176',
              500: '#e57d90',
              400: '#f1889b',
              300: '#f99aaa',
              200: '#fdb4bf',
              100: '#ffccd4',
              50: '#fff1f4',
            },

          },

          fontFamily: {

            'jp-serif': ['Noto Serif JP', 'serif'],

            'sans-refined': ['Plus Jakarta Sans', 'sans-serif'],

          },

          keyframes: {

            sparkle: {
              '0%, 100%': {
                opacity: '0.2',
                transform: 'translateY(0) scale(.8) rotate(0deg)'
              },
              '50%': {
                opacity: '1',
                transform: 'translateY(-9px) scale(1.15) rotate(10deg)'
              },
            },

            sparkleSlow: {
              '0%, 100%': {
                opacity: '0.15',
                transform: 'translate(0,0) scale(.7)'
              },
              '50%': {
                opacity: '.8',
                transform: 'translate(7px,-10px) scale(1)'
              },
            },

            floatSakura: {
              '0%, 100%': {
                transform: 'rotate(-2deg) translateY(0)'
              },
              '50%': {
                transform: 'rotate(2deg) translateY(-5px)'
              },
            },

          },

          animation: {

            sparkle: 'sparkle 3s ease-in-out infinite',

            'sparkle-slow': 'sparkleSlow 5s ease-in-out infinite',

            'float-sakura': 'floatSakura 6s ease-in-out infinite',

          },

        }
      }
    }

  </script>


  <style>

    .sakura-sparkle {
      position: absolute;
      pointer-events: none;
      color: white;
      text-shadow:
        0 0 5px rgba(255,255,255,.95),
        0 0 14px rgba(229,125,144,.8);
    }

    .sakura-branch {
      position: absolute;
      pointer-events: none;
      opacity: .55;
      z-index: 1;
      filter: drop-shadow(0 5px 10px rgba(166,72,95,.12));
    }

    .branch-line {
      position: absolute;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        transparent,
        #9e5968,
        #c47a89
      );
      transform-origin: left center;
    }

    .sakura-flower {
      position: absolute;
      font-size: 21px;
      filter: drop-shadow(0 2px 5px rgba(166,72,95,.18));
    }

  </style>

</head>


<body class="min-h-screen bg-sakura-50 font-['Plus_Jakarta_Sans'] relative overflow-hidden flex items-center justify-center p-4">


  <!-- ===================================================== -->
  <!-- FONDO -->
  <!-- ===================================================== -->

  <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden">


    <!-- Luces suaves -->

    <div class="absolute -top-40 -left-40 w-[32rem] h-[32rem] bg-sakura-200/50 rounded-full blur-[120px]">
    </div>

    <div class="absolute top-1/3 -right-40 w-[30rem] h-[30rem] bg-sakura-300/35 rounded-full blur-[120px]">
    </div>

    <div class="absolute bottom-0 left-1/4 w-[28rem] h-[28rem] bg-sakura-100/70 rounded-full blur-[120px]">
    </div>


    <!-- Textura -->

    <div class="absolute inset-0 opacity-30 bg-[radial-gradient(circle_at_1px_1px,rgba(229,125,144,0.13)_1px,transparent_0)] bg-[size:26px_26px]">
    </div>


    <!-- Destellos -->

    <span class="sakura-sparkle animate-sparkle text-lg"
          style="top:12%;left:12%;">
      ✦
    </span>

    <span class="sakura-sparkle animate-sparkle-slow text-sm"
          style="top:24%;left:24%;">
      ✧
    </span>

    <span class="sakura-sparkle animate-sparkle text-xs"
          style="top:67%;left:13%;">
      ✦
    </span>

    <span class="sakura-sparkle animate-sparkle-slow text-lg"
          style="top:80%;left:27%;">
      ✧
    </span>

    <span class="sakura-sparkle animate-sparkle text-sm"
          style="top:18%;right:15%;">
      ✦
    </span>

    <span class="sakura-sparkle animate-sparkle-slow text-xs"
          style="top:42%;right:10%;">
      ✧
    </span>

    <span class="sakura-sparkle animate-sparkle text-lg"
          style="top:73%;right:17%;">
      ✦
    </span>

    <span class="sakura-sparkle animate-sparkle-slow text-sm"
          style="top:87%;right:30%;">
      ✧
    </span>

  </div>



  <!-- ===================================================== -->
  <!-- RAMA SAKURA IZQUIERDA -->
  <!-- ===================================================== -->

  <div class="sakura-branch hidden lg:block left-[-80px] top-[40px] w-[260px] h-[440px] animate-float-sakura">

    <div class="branch-line w-[290px] top-[80px] left-0 rotate-[35deg]"></div>

    <div class="branch-line w-[170px] top-[160px] left-[50px] rotate-[65deg]"></div>

    <div class="branch-line w-[135px] top-[230px] left-[100px] rotate-[25deg]"></div>

    <div class="branch-line w-[125px] top-[300px] left-[65px] rotate-[75deg]"></div>

    <span class="sakura-flower top-[65px] left-[120px]">🌸</span>

    <span class="sakura-flower top-[120px] left-[185px]">🌸</span>

    <span class="sakura-flower top-[180px] left-[110px]">🌸</span>

    <span class="sakura-flower top-[225px] left-[195px]">🌸</span>

    <span class="sakura-flower top-[285px] left-[120px]">🌸</span>

    <span class="sakura-flower top-[345px] left-[180px]">🌸</span>

  </div>



  <!-- ===================================================== -->
  <!-- RAMA SAKURA DERECHA -->
  <!-- ===================================================== -->

  <div class="sakura-branch hidden lg:block right-[-85px] bottom-[-40px] w-[260px] h-[430px] scale-x-[-1] animate-float-sakura">

    <div class="branch-line w-[290px] top-[70px] left-0 rotate-[35deg]"></div>

    <div class="branch-line w-[170px] top-[150px] left-[50px] rotate-[65deg]"></div>

    <div class="branch-line w-[135px] top-[220px] left-[100px] rotate-[25deg]"></div>

    <div class="branch-line w-[125px] top-[290px] left-[65px] rotate-[75deg]"></div>

    <span class="sakura-flower top-[55px] left-[120px]">🌸</span>

    <span class="sakura-flower top-[115px] left-[185px]">🌸</span>

    <span class="sakura-flower top-[175px] left-[110px]">🌸</span>

    <span class="sakura-flower top-[220px] left-[195px]">🌸</span>

    <span class="sakura-flower top-[280px] left-[120px]">🌸</span>

    <span class="sakura-flower top-[340px] left-[180px]">🌸</span>

  </div>



  <!-- ===================================================== -->
  <!-- TARJETA -->
  <!-- ===================================================== -->

  <div class="relative z-10 max-w-2xl w-full rounded-[2rem] bg-white/75 backdrop-blur-2xl border border-white shadow-[0_20px_70px_rgba(166,72,95,.15)] p-8 md:p-12 text-center transition-all hover:shadow-[0_25px_85px_rgba(229,125,144,.25)] duration-500">


    <!-- Decoración superior -->

    <div class="absolute top-4 left-6 text-sakura-300 text-sm">
      ✧
    </div>

    <div class="absolute top-7 right-8 text-sakura-300 text-xs">
      ✦
    </div>


    <!-- Logo -->

    <div class="flex justify-center mb-6">

      <div class="w-20 h-20 rounded-full bg-gradient-to-br from-sakura-400 to-sakura-500 shadow-[0_0_35px_-5px_rgba(229,125,144,.7)] flex items-center justify-center p-[3px] ring-4 ring-sakura-100">

        <img src="{% static 'img/logo.png' %}"
             alt="logo"
             class="w-full h-full rounded-full object-cover bg-sakura-50">

      </div>

    </div>


    <!-- Título -->

    <h1 class="text-4xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sakura-600 via-sakura-500 to-sakura-400 tracking-tight">

      Gestor de Proyectos

    </h1>


    <!-- Línea -->

    <div class="w-24 h-1 bg-gradient-to-r from-sakura-400 to-sakura-500 mx-auto my-5 rounded-full shadow-[0_0_14px_rgba(229,125,144,.55)]">
    </div>


    <!-- Bienvenida -->

    <p class="text-lg md:text-xl text-sakura-800/70 font-light leading-relaxed">

      <span class="font-semibold text-sakura-600">
        Bienvenida, girly! :3
      </span>

      este es tu espacio central 

      <br class="hidden sm:block" />

      para organizar, seguir y hacer crecer tus proyectos con claridad y enfoque.

    </p>


    <!-- CTA -->

    <a href="{% url 'proyectos' %}">

      <div class="mt-8 inline-flex items-center gap-2 rounded-full bg-sakura-100/80 border border-sakura-200 px-5 py-2.5 text-sm text-sakura-700 font-medium shadow-[0_8px_25px_rgba(229,125,144,.15)] hover:bg-sakura-200/80 hover:border-sakura-300 hover:-translate-y-0.5 hover:shadow-[0_10px_30px_rgba(229,125,144,.25)] transition-all duration-300">

        <i class="fa-solid fa-paw" style="color: rgba(229,125,144,.8);"></i>

        <span>
          ¡Empieza ahora!
        </span>

        <i class="fa-solid fa-paw" style="color: rgba(229,125,144,.8);"></i>

      </div>

    </a>


    <!-- Nota -->

    <div class="mt-6 text-xs text-sakura-400 font-mono tracking-wider uppercase">

      · かわいい · (˶˃ ᵕ ˂˶) .ᐟ.ᐟ ·

    </div>

  </div>

</body>

</html>
